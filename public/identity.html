<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nicole Portfolio — Confirming...</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f0f9ff;
      color: #0c4a6e;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0f2fe;
      border-top: 4px solid #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Confirming your account...</p>
  </div>

  <script>
    // The Netlify Identity widget auto-detects confirmation_token,
    // invite_token, and recovery_token in the URL hash and processes them.
    // After processing, redirect to admin.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (user) {
          // Already logged in after confirmation
          window.location.href = "/admin/";
        }
      });

      window.netlifyIdentity.on("login", function () {
        window.location.href = "/admin/";
      });

      // If no identity token in the hash, redirect to the real site
      var hash = window.location.hash;
      if (!hash.includes("confirmation_token") &&
        !hash.includes("invite_token") &&
        !hash.includes("recovery_token")) {
        window.location.href = "https://nicoleliew70.github.io/portfolio/";
      }
    } else {
      // Widget failed to load, redirect to main site
      window.location.href = "https://nicoleliew70.github.io/portfolio/";
    }
  </script>
</body>

</html>
