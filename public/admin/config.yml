backend:
  name: github
  repo: nicoleliew70/portfolio
  branch: main
  base_url: https://sveltia-cms-auth.plex-hub-3.workers.dev

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # ── Site Settings ──────────────────────────────────
  - name: "site-settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "settings"
        file: "src/data/settings.json"
        fields:
          - { label: "Profile Image", name: "profileImage", widget: "image", required: false, hint: "Teacher photo for About section. Leave empty for default." }
          - { label: "WhatsApp Number (no dashes)", name: "whatsappNumber", widget: "string", hint: "e.g. 601133848412" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone (display format)", name: "phone", widget: "string", hint: "e.g. +60-1133-8484-12" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Copyright Name", name: "copyrightName", widget: "string" }
          - { label: "Brand Name", name: "brandName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }

  # ── UI Translations ────────────────────────────────
