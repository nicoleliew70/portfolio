  # ── Page Sections ──────────────────────────────────
  - name: "page-sections"
    label: "Page Sections"
    files:
      - label: "Stats Bar"
        name: "stats"
        file: "src/data/stats.json"
        fields:
          - name: "items"
            label: "Stats"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "string", hint: "Number or text like 'A+' or 'CELT'" }
              - { label: "Is Number (animates)", name: "isNumber", widget: "boolean", default: false }
              - { label: "Suffix", name: "suffix", widget: "string", required: false, hint: "e.g. '+'" }
              - { label: "Display Suffix", name: "displaySuffix", widget: "string", required: false }
              - name: "label"
                label: "Label"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "中文", name: "zh", widget: "string" }
                  - { label: "Malay", name: "ms", widget: "string" }

      - label: "Classes"
        name: "classes"
        file: "src/data/classes.json"
        fields:
          - name: "sectionTitle"
            label: "Section Title"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "中文", name: "zh", widget: "string" }
              - { label: "Malay", name: "ms", widget: "string" }
          - name: "sectionSubtitle"
            label: "Section Subtitle"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "text" }
              - { label: "中文", name: "zh", widget: "text" }
