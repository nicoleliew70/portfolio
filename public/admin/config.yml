                  - { label: "中文", name: "zh", widget: "string" }
                  - { label: "Malay", name: "ms", widget: "string" }
              - name: "desc"
                label: "Description"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "中文", name: "zh", widget: "string" }
                  - { label: "Malay", name: "ms", widget: "string" }
              - { label: "Price", name: "price", widget: "string", hint: "e.g. RM 180" }
              - { label: "Unit", name: "unit", widget: "string", hint: "e.g. /mo, /hr, /pack" }
              - { label: "Badge", name: "badge", widget: "string", required: false, hint: "e.g. Most Recommended" }
