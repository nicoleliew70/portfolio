              - { label: "Image", name: "image", widget: "image", required: false, hint: "Optional image. If empty, icon is shown instead." }
              - { label: "Color", name: "color", widget: "select", options: ["yellow", "sky", "purple"] }
              - { label: "Icon", name: "icon", widget: "select", options: ["smile", "penTool", "brain"] }
              - { label: "Badge", name: "badge", widget: "string", required: false, hint: "e.g. POPULAR (leave empty for none)" }
              - name: "features"
                label: "Features"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "list", field: { label: "Feature", name: "feature", widget: "string" } }
                  - { label: "中文", name: "zh", widget: "list", field: { label: "Feature", name: "feature", widget: "string" } }
                  - { label: "Malay", name: "ms", widget: "list", field: { label: "Feature", name: "feature", widget: "string" } }

      - label: "Pricing"
        name: "pricing"
        file: "src/data/pricing.json"
